name: 오늘의 게시물 만들기 (매일 18시)

on:
  schedule:
    - cron: "0 9 * * *"   # UTC 09:00 = 한국 18:00
  workflow_dispatch:       # 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kickoff
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 한글 글꼴 설치
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code
      - name: 뉴스 수집 · 이미지 제작
        run: python make_posts.py
      - name: 모아보기 페이지 만들기
        run: python make_page.py
      - name: 결과 저장 (이미지를 공개 주소로 올림)
        run: |
          git config user.name "kickoff-bot"
          git config user.email "kickoff-bot@users.noreply.github.com"
          git add output
          git commit -m "게시물 준비 $(date +%F)" || echo "변경 없음"
          git pull --rebase
          git push

  # 모아보기 페이지를 GitHub Pages에 올리고, 주소가 살아나면 카톡 전송
  pages:
    needs: make
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Seoul
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output
      - id: deploy
        uses: actions/deploy-pages@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 페이지가 열릴 때까지 확인
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.page_url }}$(date +%F)/")
            [ "$code" = "200" ] && echo "OK" && exit 0
            sleep 10
          done
          echo "페이지 확인 실패(그래도 카톡은 보냄)"
      - name: 카카오톡 전송
        run: python kakao_preview.py
