name: 오늘의 게시물 만들기 (매일 17시 30분)

on:
  schedule:
    - cron: "30 8 * * *"  # UTC 08:30 = 한국 17:30 (GitHub 지연 대비 여유)
  workflow_dispatch:       # 수동 실행 버튼
    inputs:
      resend_only:
        description: "카톡만 다시 보내기 (게시물 새로 안 만듦)"
        type: boolean
        default: false
      redo:
        description: "특정 게시물만 다시 만들기 (예: 4=아르나우 오르티스, 5)"
        type: string
        default: ""
      date:
        description: "대상 날짜 (예: 2026-11-09). 비우면 오늘"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kickoff
  cancel-in-progress: false

jobs:
  make:
    if: ${{ !inputs.resend_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      KICKOFF_DATE: ${{ inputs.date }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 한글 글꼴 설치
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code
      - name: 뉴스 수집 · 이미지 제작
        if: ${{ !inputs.redo }}
        run: python make_posts.py
      - name: 특정 게시물 다시 만들기
        if: ${{ inputs.redo }}
        run: python redo.py "${{ inputs.redo }}"
      - name: 모아보기 페이지 만들기
        run: python make_page.py
      - name: 결과 저장 (이미지를 공개 주소로 올림)
        run: |
          git config user.name "kickoff-bot"
          git config user.email "kickoff-bot@users.noreply.github.com"
          git add output
          git commit -m "게시물 준비 $(date +%F)" || echo "변경 없음"
          git pull --rebase
          git push
      - name: 실패하면 카톡으로 알림
        if: failure()
        run: python notify_fail.py

  # 모아보기 페이지를 GitHub Pages에 올리고, 주소가 살아나면 카톡 전송
  pages:
    needs: make
    if: ${{ always() && (needs.make.result == 'success' || inputs.resend_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    env:
      TZ: Asia/Seoul
      KICKOFF_DATE: ${{ inputs.date }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output
      # GitHub 쪽 일시 오류 대비: 실패하면 잠시 후 한 번 더. 그래도 실패해도 카톡은 보냄
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: 페이지 배포 재시도 대기
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: "3.12"
      - run: pip install requests
        if: always()
      - name: 페이지가 열릴 때까지 확인
        if: always()
        run: |
          D="${KICKOFF_DATE:-$(date +%F)}"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/$D/")
            [ "$code" = "200" ] && echo "OK" && exit 0
            sleep 10
          done
          echo "페이지 확인 실패(그래도 카톡은 보냄)"
      - name: 카카오톡 전송
        if: always()
        run: python kakao_preview.py
